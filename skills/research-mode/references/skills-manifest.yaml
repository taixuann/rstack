  - {name: scholar-evaluation, source: claude-scientific-writer, license: MIT, status: external, used_by: [project-docs]}
  - {name: doc-coauthoring, source: Anthropic skills, license: unknown, status: external, used_by: [experimental-design, protocol-wiki]}
  - {name: deep-research, source: Anthropic cowork skill, license: not redistributable, status: external, used_by: [literature-review]}
  - {name: neurokit2, source: K-Dense scientific-agent-skills, license: MIT, status: external, used_by: [project-docs]}
  - {name: lab-hardware-cad, source: K-Dense scientific-agent-skills, license: MIT, status: external, used_by: [project-docs]}
  - {name: analytical-method-validation, source: K-Dense scientific-agent-skills, license: MIT, status: external, used_by: [project-docs]}
  - {name: iso-standards-readiness, source: K-Dense scientific-agent-skills, license: MIT, status: external, used_by: [project-docs]}
